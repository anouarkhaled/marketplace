name: V1 checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "False"
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://marketplace:marketplace-test-only@127.0.0.1:5432/marketplace' || 'sqlite:///:memory:' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Check Django configuration
        run: python manage.py check --settings=config.test_settings
      - name: Check missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.test_settings
      - name: Apply migrations to a fresh database
        run: python manage.py migrate --noinput --settings=config.test_settings
      - name: Run API regressions and complete journey
        run: python manage.py test --settings=config.test_settings --shuffle --verbosity=2

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint without warnings
        run: npm run lint
      - name: Run service regressions and coverage
        run: npm run test:coverage
      - name: Build production assets
        run: npm run build

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Check web, API and admin routing
        run: |
          curl --fail --silent http://localhost:8080/health/
          curl --fail --silent http://localhost:8080/api/categories/
          curl --fail --silent --output /dev/null http://localhost:8080/admin/login/
          curl --fail --silent --output /dev/null http://localhost:8080/static/admin/css/base.css
          curl --fail --silent --output /dev/null http://localhost:8080/annonces
          docker compose exec -T frontend nginx -t
      - name: Run the complete API journey inside Docker with PostgreSQL
        run: docker compose exec -T -e TEST_DATABASE_URL=postgresql://marketplace:marketplace-local-only@db:5432/marketplace backend python manage.py test accounts.test_journey --settings=config.test_settings
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down
